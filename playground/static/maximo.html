<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property review · Reuse</title>
  <link rel="stylesheet" href="/static/workspace.css">
  <link rel="stylesheet" href="/static/maximo.css">
  <script src="/static/maximo.js" defer></script>
</head>
<body><main class="review-page">
  <nav class="review-nav"><a class="brand" href="/">↗ reuse</a><a href="/pilot">Tanner pilot</a></nav>
  <h1>Review a property</h1>
  <p>Check the space, the asking terms, and how much cash you’d need to open.</p>
  <form id="review" class="review-form">
    <label>Market<select id="city"><option>Houston</option><option>Los Angeles</option></select></label>
    <label>Filter addresses<input id="filter" type="search" placeholder="e.g. Tanner"></label>
    <label>Property<select id="property" required></select></label>
    <label>Advertised suite<select id="suite"></select></label>
    <label>Proposed use<select id="use"><option>indoor pickleball</option><option>fitness studio</option></select></label>
    <label>Deal type<select id="ownership"><option value="lease">Lease</option><option value="buy">Buy</option></select></label>
    <button class="primary" disabled>Run property review</button>
  </form>
  <p id="status" role="status" aria-live="polite">Loading properties…</p>
  <div id="report"></div>
</main></body>
</html>
