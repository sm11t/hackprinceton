<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Location &amp; Demand | Reuse</title>
<link rel="stylesheet" href="/static/workspace.css">
<script src="/static/location-demo.js" defer></script>
<style>
body { margin: 0; }
main { max-width: 860px; margin: 0 auto; padding: 48px 24px; }
form { display: grid; gap: 16px; margin: 28px 0; }
select, input { width: 100%; }
#results article { padding: 16px 0; border-bottom: 1px solid #dedfd8; }
#status { min-height: 2em; }
</style>
</head>
<body><main>
<a class="brand" href="/"><b>↗</b>reuse</a>
<h1>Location &amp; Demand</h1>
<p>Choose a property from the CoStar kit to research local conditions and comparable businesses.</p>
<form id="review">
<label class="form-field">City<select id="city"><option>Houston</option><option>Los Angeles</option></select></label>
<label class="form-field">Filter addresses<input id="filter" type="search" placeholder="e.g. Tanner"></label>
<label class="form-field">Property<select id="property" required></select></label>
<label class="form-field">Proposed use<select id="use"><option>indoor pickleball</option><option>fitness studio</option></select></label>
<button class="primary" id="run" disabled>Run live review</button>
</form>
<p id="status" role="status" aria-live="polite">Loading properties…</p>
<section id="results" aria-label="Review results"></section>
</main></body></html>
